# Pages come from the static site in /var/www/summit (synced from GitHub every 5 minutes).
# Django (gunicorn on port 8000) still handles /admin, the contact form and article pages.
server {
    listen 443 ssl;
    server_name summitbrilliance.com www.summitbrilliance.com 16.178.165.97;
    client_max_body_size 2m;
    root /var/www/summit;
    index index.html;

    location /images/ { expires 7d; }
    location /news-img/ { expires 7d; }
    location /static/ { alias /home/ec2-user/mysite/static/; expires 7d; }
    location = /admin { return 301 /admin/; }
    location /admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ~ ^/(zh/|cn/)?(contact|article-[A-Za-z0-9_-]+)\.html$ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / { try_files $uri $uri/ =404; add_header Cache-Control "no-cache"; }

    ssl_certificate /etc/letsencrypt/live/summitbrilliance.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/summitbrilliance.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
server {
    listen 80 default_server;
    server_name summitbrilliance.com www.summitbrilliance.com 16.178.165.97;
    if ($host ~* ^(www\.)?summitbrilliance\.com$) { return 301 https://$host$request_uri; }
    root /var/www/summit;
    index index.html;

    location /images/ { }
    location /news-img/ { }
    location /static/ { alias /home/ec2-user/mysite/static/; }
    location = /admin { return 301 /admin/; }
    location /admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ~ ^/(zh/|cn/)?(contact|article-[A-Za-z0-9_-]+)\.html$ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / { try_files $uri $uri/ =404; add_header Cache-Control "no-cache"; }
}
